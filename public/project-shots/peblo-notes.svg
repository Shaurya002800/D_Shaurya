<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Peblo Notes project preview</title>
  <desc id="desc">A stylized preview card for the Peblo Notes AI notes workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#120f24"/>
      <stop offset="0.52" stop-color="#191336"/>
      <stop offset="1" stop-color="#32220d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="1" stop-color="#f0d38a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1150" cy="120" r="220" fill="#f2c94c" opacity="0.12"/>
  <circle cx="180" cy="710" r="260" fill="#8b5cf6" opacity="0.16"/>
  <g filter="url(#shadow)">
    <rect x="150" y="120" width="1100" height="580" rx="42" fill="#0e1020" stroke="#f2c94c" stroke-opacity="0.28" stroke-width="3"/>
    <rect x="210" y="185" width="380" height="450" rx="28" fill="url(#card)"/>
    <path d="M268 268h246M268 328h196M268 388h246M268 448h156M268 508h216" stroke="#2d2418" stroke-width="24" stroke-linecap="round" opacity="0.82"/>
    <rect x="650" y="205" width="500" height="86" rx="22" fill="#171b31" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="650" y="326" width="500" height="86" rx="22" fill="#171b31" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="650" y="447" width="500" height="86" rx="22" fill="#171b31" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="700" y="260" fill="#f8f4e8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Auto-save notes</text>
    <text x="700" y="381" fill="#f8f4e8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Tags and sharing</text>
    <text x="700" y="502" fill="#f8f4e8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Local AI fallback</text>
    <text x="210" y="90" fill="#f2c94c" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="8">AI NOTES WORKSPACE</text>
    <text x="650" y="625" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900">Peblo Notes</text>
  </g>
</svg>
